<ion-content [fullscreen]="true">

  <!-- HEADER -->
  <header class="header">

    <div class="saludo">
      <span class="hola">¡Hola,</span>
      <span class="nombre">Nana!</span>
    </div>

  

  </header>


  <!-- CONTENIDO -->
  <main class="contenido">

    <div class="titulo-seccion">
      <div>
        <span class="mini-titulo">TU INSPIRACIÓN</span>
        <h1>Descubre ✦</h1>
      </div>

      <button class="boton-filtro">
        ✦
      </button>
    </div>


    <!-- COLLAGE -->
    <section class="galeria">
      @for (publicacion of servicio.publicaciones(); track publicacion.id; let indice = $index) {
      <div
        class="foto"
        [class.foto-alta]="indice % 3 === 0"
        [class.foto-media]="indice % 3 === 1"
        [class.foto-baja]="indice % 3 === 2">
        <img [src]="publicacion.imagen" [alt]="publicacion.titulo">
        <button
          type="button"
          class="corazon"
          [class.es-favorita]="publicacion.favorita"
          [attr.aria-label]="publicacion.favorita ? 'Quitar de favoritos' : 'Agregar a favoritos'"
          [attr.aria-pressed]="publicacion.favorita"
          (click)="servicio.cambiarFavorito(publicacion.id)">
          {{ publicacion.favorita ? '♥' : '♡' }}
        </button>
      </div>
      } @empty {
      <p class="sin-publicaciones">Todavía no hay publicaciones.</p>
      }
    </section>

  </main>

</ion-content>
