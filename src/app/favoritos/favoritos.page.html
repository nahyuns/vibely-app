<ion-content [fullscreen]="true">

  <main class="contenido">

    <div class="encabezado">
      <span class="mini-titulo">TU COLECCIÓN</span>
      <h1>Favoritos ♡</h1>
      <p>Todo lo que guardaste en un solo lugar.</p>
    </div>

    <section class="galeria">
      @for (publicacion of favoritas(); track publicacion.id; let indice = $index) {
      <article
        class="foto"
        [class.foto-alta]="indice % 3 === 0"
        [class.foto-media]="indice % 3 === 1"
        [class.foto-baja]="indice % 3 === 2">
        <img [src]="publicacion.imagen" [alt]="publicacion.titulo">

        <div class="detalle">
          <h2>{{ publicacion.titulo }}</h2>
          <p>{{ publicacion.categoria }}</p>
        </div>

        <button
          type="button"
          class="corazon"
          (click)="servicio.cambiarFavorito(publicacion.id)"
          aria-label="Quitar de favoritos">
          ♥
        </button>
      </article>
      } @empty {
      <p class="vacio">Aún no tienes favoritos. Toca el corazón de una publicación para guardarla aquí.</p>
      }
    </section>

  </main>

</ion-content>
